server:
  port: 8084

spring:
  application:
    name: aviones

  datasource:
    url: jdbc:postgresql://localhost:5432/proyecto_aeropuerto
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

