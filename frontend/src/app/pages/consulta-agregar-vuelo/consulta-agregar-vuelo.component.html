<div class="contenedor">

  <h1>Agregar Vuelo</h1>

  <!-- PASO 1 -->
  <div
    *ngIf="pasoActual === 1"
    class="card">

    <h2>Información del Vuelo</h2>

    <div class="grid">

      <!-- AEROPUERTO SALIDA -->
      <div>

        <label>Aeropuerto Salida</label>

        <select [(ngModel)]="vuelo.aeropuertoSalida">

          <option value="">
            Seleccione
          </option>

          <option
            *ngFor="let aeropuerto of aeropuertos"
            [value]="aeropuerto">

            {{ aeropuerto }}

          </option>

        </select>

      </div>

      <!-- AEROPUERTO LLEGADA -->
      <div>

        <label>Aeropuerto Llegada</label>

        <select [(ngModel)]="vuelo.aeropuertoLlegada">

          <option value="">
            Seleccione
          </option>

          <option
            *ngFor="let aeropuerto of aeropuertos"
            [value]="aeropuerto">

            {{ aeropuerto }}

          </option>

        </select>

      </div>

      <!-- FECHA SALIDA -->
      <div>

        <label>Fecha Salida</label>

        <input
          type="date"
          [(ngModel)]="vuelo.fechaSalida">

      </div>

      <!-- HORA SALIDA -->
      <div>

        <label>Hora Salida</label>

        <input
          type="time"
          [(ngModel)]="vuelo.horaSalida">

      </div>

      <!-- FECHA LLEGADA -->
      <div>

        <label>Fecha Llegada</label>

        <input
          type="date"
          [(ngModel)]="vuelo.fechaLlegada">

      </div>

      <!-- HORA LLEGADA -->
      <div>

        <label>Hora Llegada</label>

        <input
          type="time"
          [(ngModel)]="vuelo.horaLlegada">

      </div>

    </div>

    <div class="acciones">

      <button
        class="btn cancelar"
        (click)="cancelar()">

        Cancelar

      </button>

      <button
        class="btn"
        (click)="siguientePaso()">

        Siguiente

      </button>

    </div>

  </div>

  <!-- PASO 2 -->
  <div
    *ngIf="pasoActual === 2"
    class="card">

    <h2>Seleccionar Avión</h2>

    <table>

      <thead>

      <tr>

        <th>ID</th>
        <th>Modelo</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Seleccionar</th>

      </tr>

      </thead>

      <tbody>

      <tr *ngFor="let avion of avionesDisponibles">

        <td>{{ avion.id }}</td>

        <td>{{ avion.modelo }}</td>

        <td>{{ avion.capacidad }}</td>

        <td>{{ avion.estado }}</td>

        <td>

          <button
            class="btn"
            (click)="seleccionarAvion(avion.id)">

            Seleccionar

          </button>

        </td>

      </tr>

      </tbody>

    </table>

    <div class="precios">

      <div>

        <label>Precio Clase Económica</label>

        <input
          type="number"
          [(ngModel)]="vuelo.precioEconomica">

      </div>

      <div>

        <label>Precio Clase Ejecutiva</label>

        <input
          type="number"
          [(ngModel)]="vuelo.precioEjecutiva">

      </div>

    </div>

    <div class="acciones">

      <button
        class="btn cancelar"
        (click)="nuevoVuelo()">

        Cancelar

      </button>

      <button
        class="btn"
        (click)="irTripulacion()">

        Siguiente

      </button>

    </div>

  </div>

  <!-- PASO 3 -->
  <div
    *ngIf="pasoActual === 3"
    class="card">

    <h2>Seleccionar Tripulación</h2>

    <div class="tripulacion">

      <div
        *ngFor="let tripulante of tripulantesDisponibles"
        class="tripulante">

        <input
          type="checkbox"
          [checked]="vuelo.tripulacion.includes(tripulante)"
          (change)="toggleTripulante(tripulante)">

        <span>

          {{ tripulante }}

        </span>

      </div>

    </div>

    <div class="acciones">

      <button
        class="btn cancelar"
        (click)="nuevoVuelo()">

        Cancelar

      </button>

      <button
        class="btn guardar"
        (click)="guardarVuelo()">

        Guardar Vuelo

      </button>

    </div>

  </div>

</div>
