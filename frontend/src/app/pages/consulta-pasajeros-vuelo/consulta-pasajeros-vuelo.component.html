<div class="consulta-container">

  <div class="consulta-card">

    <h2>Consulta de Pasajeros por Vuelo ✈️</h2>

    <!-- FILTRO -->
    <div class="filtros">

      <div class="campo">

        <label>Número de Vuelo</label>

        <input
          type="text"
          placeholder="Ingrese número de vuelo"
          [(ngModel)]="numeroVuelo">

      </div>

    </div>

    <!-- BOTONES -->
    <div class="acciones">

      <button
        class="btn buscar"
        (click)="buscarPasajeros()">

        BUSCAR
      </button>

      <button
        class="btn limpiar"
        (click)="limpiarFiltros()">

        LIMPIAR
      </button>

      <button
        class="btn nueva"
        (click)="nuevaConsulta()">

        NUEVA CONSULTA
      </button>

      <button
        class="btn pdf"
        [disabled]="!consultaRealizada"
        (click)="imprimirPDF()">

        IMPRIMIR PDF
      </button>

      <button
        class="btn excel"
        [disabled]="!consultaRealizada"
        (click)="exportarExcel()">

        EXCEL
      </button>

    </div>

    <!-- TABLA -->
    <div
      class="tabla-container"
      *ngIf="pasajeros.length > 0">

      <table>

        <thead>

        <tr>
          <th>Nombre Pasajero</th>
          <th>Número Pasaporte</th>
          <th>Nacionalidad</th>
          <th>Edad</th>
          <th>Teléfono</th>
          <th>Correo Electrónico</th>
        </tr>

        </thead>

        <tbody>

        <tr *ngFor="let pasajero of pasajeros">

          <td>{{ pasajero.nombrePasajero }}</td>
          <td>{{ pasajero.numeroPasaporte }}</td>
          <td>{{ pasajero.nacionalidad }}</td>
          <td>{{ pasajero.edad }}</td>
          <td>{{ pasajero.telefono }}</td>
          <td>{{ pasajero.correo }}</td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
