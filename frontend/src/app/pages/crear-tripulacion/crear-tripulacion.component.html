<div class="contenedor">

  <div class="card">

    <h1>Crear Tripulación</h1>

    <div class="grid">

      <!-- PILOTO -->
      <div class="campo">

        <label>Piloto</label>

        <select
          [(ngModel)]="tripulacion.piloto">

          <option value="">
            Seleccione un piloto
          </option>

          <option
            *ngFor="let piloto of pilotos"
            [value]="piloto.personalTripulacionId">

            {{ piloto.nombre }}

          </option>

        </select>

      </div>

      <!-- COPILOTO -->
      <div class="campo">

        <label>Co-Piloto</label>

        <select
          [(ngModel)]="tripulacion.copiloto">

          <option value="">
            Seleccione un copiloto
          </option>

          <option
            *ngFor="let copiloto of copilotos"
            [value]="copiloto.personalTripulacionId">

            {{ copiloto.nombre }}

          </option>

        </select>

      </div>

      <!-- INGENIERO -->
      <div class="campo">

        <label>Ingeniero de Vuelo</label>

        <select
          [(ngModel)]="tripulacion.ingeniero">

          <option value="">
            Seleccione un ingeniero
          </option>

          <option
            *ngFor="let ingeniero of ingenieros"
            [value]="ingeniero.personalTripulacionId">

            {{ ingeniero.nombre }}

          </option>

        </select>

      </div>

    </div>

    <!-- CABINA -->
    <div class="cabina-container">

      <h2>
        Tripulantes de Cabina
      </h2>

      <p>
        Seleccione 3 tripulantes
      </p>

      <div class="cabina-grid">

        <div
          *ngFor="let tripulante of tripulantesCabina"
          class="cabina-item">

          <label class="checkbox-label">

            <input
              type="checkbox"

              [checked]="
                tripulacion.cabina.includes(
                  tripulante.personalTripulacionId
                )
              "

              (change)="
                toggleCabina(
                  tripulante.personalTripulacionId
                )
              "
            >

            <span>

              {{ tripulante.nombre }}

            </span>

          </label>

        </div>

      </div>

    </div>

    <!-- BOTONES -->
    <div class="acciones">

      <button
        class="btn limpiar"
        (click)="limpiarFormulario()">

        Limpiar

      </button>

      <button
        class="btn guardar"
        (click)="guardarTripulacion()">

        Guardar

      </button>

    </div>

  </div>

</div>
