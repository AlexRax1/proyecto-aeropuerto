<div class="auth-container">

  <div class="auth-card">

    <h2>Iniciar Sesión ✈️</h2>

    <input
      type="email"
      placeholder="Correo"
      [(ngModel)]="loginData.correo">

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="loginData.password">

    <button (click)="login()">
      Ingresar
    </button>

    <p>
      ¿No tienes cuenta?
      <a routerLink="/registro">Crear cuenta</a>
    </p>

  </div>

</div>
