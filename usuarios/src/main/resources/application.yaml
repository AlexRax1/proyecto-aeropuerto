spring:
  application:
    name: usuarios

  datasource:
    url: jdbc:postgresql://localhost:5432/proyecto_aeropuerto
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET_KEY}